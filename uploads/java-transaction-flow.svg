<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 600" width="1520" height="600" role="img" aria-label="트랜잭션 코드 흐름 - 자동커밋 끄기, 작업, 커밋 또는 롤백, 되돌리기">
  <rect width="1520" height="600" fill="#f8fafc"/>
  <style>
    .t{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
    .h{font-size:40px;font-weight:800;fill:#0f172a}
    .n{font-size:24px;font-weight:800;fill:#ffffff}
    .lb{font-size:26px;font-weight:700;fill:#0f172a}
    .cd{font-family:Consolas,'D2Coding',monospace;font-size:23px;fill:#1d4ed8}
    .sm{font-size:21px;fill:#475569}
  </style>
  <text class="t h" x="76" y="82">코드에서는 이 순서입니다</text>

  <!-- step 1 -->
  <rect x="76" y="126" width="316" height="200" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="122" cy="172" r="26" fill="#0f172a"/><text class="t n" x="114" y="181">1</text>
  <text class="t lb" x="162" y="181">자동 저장 끄기</text>
  <text class="t cd" x="106" y="240">conn.setAutoCommit</text>
  <text class="t cd" x="106" y="272">(false);</text>
  <text class="t sm" x="106" y="306">이제 내가 확정할 때까지 대기</text>

  <!-- step 2 -->
  <rect x="428" y="126" width="316" height="200" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="474" cy="172" r="26" fill="#0f172a"/><text class="t n" x="466" y="181">2</text>
  <text class="t lb" x="514" y="181">작업 여러 개</text>
  <text class="t cd" x="458" y="240">executeUpdate();</text>
  <text class="t cd" x="458" y="272">executeUpdate();</text>
  <text class="t sm" x="458" y="306">출금과 입금을 이어서 실행</text>

  <!-- step 3 성공 -->
  <rect x="780" y="126" width="316" height="200" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <circle cx="826" cy="172" r="26" fill="#16a34a"/><text class="t n" x="818" y="181">3</text>
  <text class="t lb" x="866" y="181">둘 다 성공하면</text>
  <text class="t cd" x="810" y="248" fill="#15803d">conn.commit();</text>
  <text class="t sm" x="810" y="298">여기서 비로소 진짜 저장</text>

  <!-- step 3' 실패 -->
  <rect x="1132" y="126" width="316" height="200" rx="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="3"/>
  <circle cx="1178" cy="172" r="26" fill="#dc2626"/><text class="t n" x="1168" y="181">3'</text>
  <text class="t lb" x="1218" y="181">하나라도 실패</text>
  <text class="t cd" x="1162" y="248" fill="#b91c1c">conn.rollback();</text>
  <text class="t sm" x="1162" y="298">앞의 출금까지 원상복구</text>

  <!-- arrows -->
  <path d="M392 226 L428 226" stroke="#94a3b8" stroke-width="4" marker-end="url(#a)"/>
  <path d="M744 226 L780 226" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>
  <path d="M744 226 L764 226 L764 372 L1290 372 L1290 336" stroke="#dc2626" stroke-width="4" fill="none" stroke-dasharray="9 7" marker-end="url(#r)"/>
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#94a3b8"/></marker>
    <marker id="g" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#16a34a"/></marker>
    <marker id="r" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#dc2626"/></marker>
  </defs>
  <text class="t sm" x="800" y="366" fill="#b91c1c">예외가 나면 이 길로 — catch 안에서 rollback</text>

  <rect x="76" y="424" width="1372" height="104" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="3"/>
  <text class="t lb" x="112" y="466">마지막에 원래대로 돌려놓기</text>
  <text class="t cd" x="112" y="504">conn.setAutoCommit(true);  →  연결을 재사용할 때를 위해 finally에서 정리</text>
</svg>
