<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="인포스틸러 감염 흐름: 파일 실행부터 계정 연쇄 침해까지">
  <rect width="1200" height="480" fill="#f8fafc"/>
  <style>
    .t{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
    .h{font-size:30px;font-weight:800;fill:#0f172a}
    .n{font-size:19px;font-weight:800;fill:#fff}
    .lb{font-size:20px;font-weight:700;fill:#0f172a}
    .sm{font-size:16px;fill:#475569}
  </style>
  <text class="t h" x="56" y="62">한 번의 실행이 계정 전체로 번지는 길</text>

  <g>
    <rect x="56" y="98" width="252" height="150" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="94" cy="136" r="20" fill="#0f172a"/><text class="t n" x="88" y="143">1</text>
    <text class="t lb" x="126" y="143">내려받고 실행</text>
    <text class="t sm" x="82" y="186">설치 파일·크랙·가짜 런처</text>
    <text class="t sm" x="82" y="212">확인 없이 더블클릭</text>
  </g>
  <g>
    <rect x="342" y="98" width="252" height="150" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="380" cy="136" r="20" fill="#0f172a"/><text class="t n" x="374" y="143">2</text>
    <text class="t lb" x="412" y="143">조용히 수집</text>
    <text class="t sm" x="368" y="186">저장 비밀번호·쿠키</text>
    <text class="t sm" x="368" y="212">지갑·시스템 정보</text>
  </g>
  <g>
    <rect x="628" y="98" width="252" height="150" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="666" cy="136" r="20" fill="#0f172a"/><text class="t n" x="660" y="143">3</text>
    <text class="t lb" x="698" y="143">로그로 판매</text>
    <text class="t sm" x="654" y="186">다크웹에서 거래</text>
    <text class="t sm" x="654" y="212">여러 구매자에게 재판매</text>
  </g>
  <g>
    <rect x="914" y="98" width="230" height="150" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <circle cx="952" cy="136" r="20" fill="#dc2626"/><text class="t n" x="946" y="143">4</text>
    <text class="t lb" x="984" y="143">연쇄 침해</text>
    <text class="t sm" x="940" y="186">메일 → 결제 → 가입 서비스</text>
    <text class="t sm" x="940" y="212" fill="#b91c1c">세션이면 인증 절차 없이</text>
  </g>
  <path d="M308 173 L342 173" stroke="#94a3b8" stroke-width="4" marker-end="url(#a2)"/>
  <path d="M594 173 L628 173" stroke="#94a3b8" stroke-width="4" marker-end="url(#a2)"/>
  <path d="M880 173 L914 173" stroke="#dc2626" stroke-width="4" marker-end="url(#a3)"/>
  <defs>
    <marker id="a2" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#94a3b8"/></marker>
    <marker id="a3" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="56" y="296" width="1088" height="128" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text class="t lb" x="88" y="340">끊는 지점은 1번입니다</text>
  <text class="t sm" x="88" y="378" font-size="18">공식 홈페이지·정식 스토어에서만 내려받기 · "설치하려면 백신을 꺼 주세요"는 그 자체가 신호</text>
  <text class="t sm" x="88" y="406" font-size="18">2번 이후는 이미 내 손을 떠납니다 — 비밀번호를 바꿔도 세션 쿠키는 따로 만료시켜야 합니다</text>
</svg>
